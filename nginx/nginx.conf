server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    log_format json_access escape=json
        '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
        '"status":$status,"latency_ms":$request_time,"bytes":$body_bytes_sent,'
        '"client_ip":"$remote_addr","user_agent":"$http_user_agent"}';

    access_log /dev/stdout json_access;
    error_log /dev/stderr;

    location /api/catalogue/ {
        proxy_pass http://roboshop-catalogue:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/cart/ {
        proxy_pass http://roboshop-cart:8080/cart/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/user/ {
        proxy_pass http://roboshop-user:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ratings {
        rewrite ^/api/ratings(.*) /ratings$1 break;
        proxy_pass http://roboshop-ratings:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/shipping/ {
        proxy_pass http://roboshop-shipping:8080/shipping/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/payment/ {
        proxy_pass http://roboshop-payment:8080/payment/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/orders/ {
        proxy_pass http://roboshop-orders:8080/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
